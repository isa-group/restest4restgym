    # body.toAirportId: generated by the application; the API's own replies supply it  (body, string, looks like an identifier)
    # every departure before every arrival, all on 2027-06-14, flights of 1 h 05 to 17 h 35
    body.departureTime: ["2027-06-14T05:45:00Z", "2027-06-14T06:30:00Z", "2027-06-14T07:00:00.000Z", "2027-06-14T07:45:00Z", "2027-06-14T08:15:00Z", "2027-06-14T08:40:00+03:00", "2027-06-14T09:05:00Z", "2027-06-14T09:30:00Z", "2027-06-14T10:10:00Z", "2027-06-14T10:45:00Z"]
